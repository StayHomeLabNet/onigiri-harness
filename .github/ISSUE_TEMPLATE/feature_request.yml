name: Feature request
description: 新しい機能や改善を提案する
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい問題
      description: 現在どのような操作や制約で困っているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する動作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
  - type: dropdown
    id: area
    attributes:
      label: 対象領域
      options:
        - Chat / UI
        - Model Provider
        - RAG / Knowledge
        - AI Task / MCP
        - Decision Lab
        - Compatibility API
        - Distribution / Documentation
        - Other
    validations:
      required: true
